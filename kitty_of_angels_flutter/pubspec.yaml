name: kitty_of_angels
description: Kitty of Angels - Cat Adoption App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.0.0

  # Database
  sqflite: ^2.3.2
  path: ^1.8.3

  # Networking
  dio: ^5.4.0

  # UI Components
  cached_network_image: ^3.3.1
  carousel_slider: ^4.2.1
  shimmer: ^3.0.0

  # Utilities
  intl: ^0.19.0
  share_plus: ^7.2.1
  url_launcher: ^6.2.4
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  csv: ^6.0.0

  # Icons
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: OpenSans
      fonts:
        - asset: fonts/OpenSans-Regular.ttf
        - asset: fonts/OpenSans-Semibold.ttf
          weight: 600
    - family: Forque
      fonts:
        - asset: fonts/Forque.ttf
